<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AetherMap — Intelligence Dashboard</title>

    <!-- Fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap (somente grid — o CSS Palantir substitui estilo) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <!-- Plotly -->
    <script src="https://cdn.plot.ly/plotly-2.20.0.min.js"></script>

    <!-- CSS Palantir -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar px-4">
    <div class="container-fluid d-flex align-items-center">
        <img src="logo.png" class="header-logo">
        <span class="navbar-brand">AetherMap Intelligence</span>
    </div>
</nav>


<!-- MAIN WRAPPER -->
<div class="container mt-5" style="max-width: 1200px;">


    <!-- === SECTION: CONTROL PANEL === -->
    <div class="card mb-5">
        <h5 class="mb-3">Painel de Análise</h5>

        <div class="row g-4">

            <div class="col-md-6">
                <label class="form-label">1. Carregue seu arquivo .txt</label>
                <input type="file" id="fileUpload" class="form-control">
            </div>

            <div class="col-md-6">
                <label class="form-label">2. Número de Amostras: 
                    <span id="sampleValue">1000</span>
                </label>
                <input type="range" id="sampleRange" class="form-range" min="100" max="20000" value="1000">
            </div>

        </div>

        <div class="text-center mt-4">
            <button class="btn btn-primary px-5 py-3" id="generateUniverseBtn">
                ✦ Gerar Universo ✦
            </button>
        </div>
    </div>


    <!-- === SECTION: SEARCH === -->
    <div class="card mb-5">
        <h5 class="mb-3">Busca Semântica</h5>
        <input type="text" id="searchInput" class="form-control" placeholder="Buscar conceito no universo...">
    </div>


    <!-- === SECTION: 3D MAP === -->
    <div class="card mb-5 p-0">
        <h5 class="p-3 pb-0">Mapa Semântico 3D</h5>
        <small class="text-muted px-3">Visualização dos clusters UMAP / HDBSCAN</small>

        <div id="plotContainer" style="width:100%; height:600px;" class="mt-3"></div>
    </div>


    <!-- === SECTION: QUANTITATIVE METRICS === -->
    <div class="card mb-5">
        <h5 class="mb-3">Análise Quantitativa</h5>

        <div class="metrics-grid" id="metricsGrid">
            <!-- preenchido dinamicamente -->
        </div>

        <div id="keywords-container" class="mt-4">
            <strong>Top Palavras-Chave (TF-IDF):</strong>
            <div id="keywords" class="mt-2"></div>
        </div>
    </div>


    <!-- === SECTION: DUPLICITY === -->
    <div class="card mb-5">
        <h5 class="mb-3">Duplicidade Detectada</h5>

        <div id="exact-duplicates">
            <strong>Duplicados Exatos:</strong>
            <div id="exactList" class="mt-3"></div>
        </div>

        <hr style="border-color: var(--border);">

        <div id="semantic-duplicates" class="mt-4">
            <strong>Pares Semânticos:</strong>
            <div id="semanticList" class="mt-3"></div>
        </div>
    </div>


</div> <!-- container -->


<!-- FOOTER -->
<footer class="text-center text-muted mt-5 mb-4">
    AetherMap Intelligence © 2025 — Strand Data Operations
</footer>


<!-- SCRIPT -->
<script src="script.js"></script>

</body>
</html>
