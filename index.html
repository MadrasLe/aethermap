<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AetherMap by Strand DataOps</title>
    
    <!-- Frameworks e Bibliotecas -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-2.29.1.min.js" charset="utf-8"></script>
    <!-- Fuse.js, nosso motor de busca ultrarrápido para o frontend -->
    <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.min.js"></script>

    <!-- Nosso Estilo Personalizado -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container-fluid p-4 p-md-5">
        <header class="text-center mb-5">
            <img src="logo.png" alt="Strand DataOps Logo" class="header-logo">
            <h1 class="display-4">AetherMap</h1>
            <p class="lead text-muted">Uma Ferramenta de Análise por Strand DataOps</p>
        </header>

        <main class="row">
            <!-- Coluna de Controles -->
            <aside class="col-lg-3">
                <div class="card mb-3 sticky-top" style="top: 20px;">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Controles</h5>
                        <div class="mb-3">
                            <label for="fileUpload" class="form-label">1. Carregue seu arquivo .txt</label>
                            <input class="form-control" type="file" id="fileUpload" accept=".txt">
                        </div>
                        <div class="mb-3">
                            <label for="samplesSlider" class="form-label">2. Número de Amostras: <span id="samplesValue" class="fw-bold">10000</span></label>
                            <input type="range" class="form-range" min="500" max="50000" step="500" value="10000" id="samplesSlider">
                        </div>
                        <div class="d-grid">
                            <button id="processButton" class="btn btn-primary btn-lg">✨ Gerar Universo ✨</button>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Coluna Principal de Visualização -->
            <section class="col-lg-9">
                <div id="loadingSection" class="text-center my-5 d-none">
                    <div class="spinner-border" style="width: 3rem; height: 3rem;" role="status"></div>
                    <p class="mt-3 fs-5">Forjando o universo... Isso pode levar alguns minutos.</p>
                    <small class="text-muted">A Torre do Mago está processando sua requisição.</small>
                </div>

                <!-- Barra de Busca (aparece após o processamento) -->
                <div class="card mb-3 d-none" id="search-card">
                    <div class="card-body">
                         <input type="text" id="searchInput" class="form-control" placeholder="Busque por um conceito para destacar no universo...">
                    </div>
                </div>

                <!-- Contêiner do Gráfico 3D -->
                <div id="plotContainer" class="rounded" style="min-height: 70vh;"></div>
                
                <!-- Painel de Resultados Completo (aparece após o processamento) -->
                <div id="resultsPanel" class="mt-4 d-none">
                    <div class="row">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-body">
                                    <h5 class="card-title">Análise Quantitativa</h5>
                                    <div id="metrics-container" class="row text-center gy-3"></div>
                                    <hr class="my-4">
                                    <div id="keywords-container"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row mt-4">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-body">
                                    <h5 class="card-title">Análise de Duplicidade</h5>
                                    <div id="duplicates-container"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- A Alma da Fortaleza: Nosso script completo -->
    <script src="script.js"></script>
</body>
</html>
