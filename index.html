<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AetherMap Intelligence</title>
    <link rel="stylesheet" href="style.css" />

    <!-- Plotly -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>

<body>

<!-- NAVBAR -->
<header class="nav">
    <div class="nav-left">
        <img src="logo.png" class="logo">
        <h1 class="title">AetherMap Intelligence</h1>
    </div>
</header>

<!-- MAIN WRAPPER -->
<div class="container">

    <!-- UPLOAD PANEL -->
    <section class="panel">
        <h2 class="panel-title">Painel de Análise</h2>

        <label class="label">Carregar arquivo .txt</label>
        <input type="file" id="fileUpload" class="input-file">

        <label class="label">Número de Amostras</label>
        <input type="range" id="sampleSlider" min="100" max="10000" value="1000" class="input-slider">
        <div id="sampleValue" class="slider-value">1000</div>

        <button id="generateBtn" class="btn-primary">Gerar Universo</button>
    </section>

    <!-- SEARCH PANEL -->
    <section class="panel">
        <h2 class="panel-title">Busca Semântica</h2>
        <input id="searchInput" class="input-text" placeholder="Digite um conceito para destacar...">
    </section>

    <!-- 3D MAP -->
    <section class="panel">
        <h2 class="panel-title">Mapa Semântico 3D</h2>
        <div id="plotContainer" class="plot"></div>
    </section>

    <!-- METRICS -->
    <section class="panel">
        <h2 class="panel-title">Análise Quantitativa</h2>

        <div class="metrics-grid">
            <div class="metric"><div id="m_docs" class="metric-number">–</div><span>Documentos</span></div>
            <div class="metric"><div id="m_clusters" class="metric-number">–</div><span>Clusters</span></div>
            <div class="metric"><div id="m_noise" class="metric-number">–</div><span>Ruído</span></div>
            <div class="metric"><div id="m_lex" class="metric-number">–</div><span>Riqueza Lexical</span></div>
            <div class="metric"><div id="m_entropy" class="metric-number">–</div><span>Entropia</span></div>
        </div>

        <h3 class="sub-title">Palavras-Chave (TF-IDF)</h3>
        <div id="keywords" class="keywords"></div>
    </section>

    <!-- DUPLICATES -->
    <section class="panel">
        <h2 class="panel-title">Duplicidade Semântica</h2>
        <div id="duplicateList" class="duplicates"></div>
    </section>

</div>

<script src="script.js"></script>
</body>
</html>
