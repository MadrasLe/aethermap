<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AetherMap by Strand DataOps</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.plot.ly/plotly-2.29.1.min.js" charset="utf-8"></script>
</head>
<body>
    <div class="container-fluid p-4">
        <header class="text-center mb-5">
            <img src="logo.png" alt="Strand DataOps Logo" class="header-logo">
            <h1 class="display-4">AetherMap</h1>
            <p class="lead text-muted">Uma Ferramenta de Análise por Strand DataOps</p>
        </header>
        <main class="row">
            <aside class="col-lg-3">
                <div class="card mb-3">
                    <div class="card-body">
                        <!-- ... (Controles) ... -->
                    </div>
                </div>
            </aside>
            <section class="col-lg-9">
                <div id="loadingSection" class="text-center my-5 d-none">
                    <!-- ... (Spinner) ... -->
                </div>
                <div id="plotContainer" class="rounded" style="min-height: 70vh;"></div>
                
                <!-- <<< PAINEL DE RESULTADOS COMPLETO >>> -->
                <div id="resultsPanel" class="mt-4 d-none">
                    <div class="row">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-body">
                                    <h5 class="card-title">Análise Quantitativa</h5>
                                    <div id="metrics-container" class="row"></div>
                                    <div id="keywords-container" class="mt-3"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row mt-4">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-body">
                                    <h5 class="card-title">Análise de Duplicidade</h5>
                                    <div id="duplicates-container"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
