<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AetherMap by Strand DataOps</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.plot.ly/plotly-2.29.1.min.js" charset="utf-8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="logo.png" alt="Strand DataOps Logo" class="header-logo">
                <span>AetherMap</span>
            </a>
        </div>
    </nav>

    <main class="container-fluid mt-4">
        <!-- <<< A NOVA ESTRUTURA DE DUAS COLUNAS >>> -->
        <div class="row">
            <!-- Coluna Principal: Controles e Observatório (70%) -->
            <div class="col-lg-8">
                <div class="accordion mb-4" id="controlsAccordion">
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseControls" aria-expanded="true" aria-controls="collapseControls">
                                <i class="bi bi-sliders me-2"></i> Controles de Análise
                            </button>
                        </h2>
                        <div id="collapseControls" class="accordion-collapse collapse show" data-bs-parent="#controlsAccordion">
                            <div class="accordion-body">
                                <div class="row align-items-center">
                                    <div class="col-md-5 mb-3 mb-md-0"><label for="fileUpload" class="form-label">1. Carregue seu arquivo .txt</label><input class="form-control" type="file" id="fileUpload" accept=".txt"></div>
                                    <div class="col-md-7 mb-3 mb-md-0"><label for="samplesSlider" class="form-label">2. Número de Amostras: <span id="samplesValue" class="fw-bold">10000</span></label><input type="range" class="form-range" min="500" max="50000" step="500" value="10000" id="samplesSlider"></div>
                                </div>
                                <div class="d-grid mt-3"><button id="processButton" class="btn btn-primary btn-lg"><i class="bi bi-stars me-2"></i>Gerar Universo</button></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="loadingSection" class="text-center my-5 d-none"><div class="spinner-border" style="width: 3rem; height: 3rem;" role="status"></div><p class="mt-3 fs-5">Forjando o universo...</p></div>
                <div id="search-card" class="mb-3 fade-in-section"><div class="input-group"><span class="input-group-text"><i class="bi bi-search"></i></span><input type="text" id="searchInput" class="form-control form-control-lg" placeholder="Busque por um conceito para destacar no universo..."></div></div>
                <div id="plotContainer" class="rounded"><div id="emptyState" class="text-center h-100 d-flex flex-column justify-content-center align-items-center"><i class="bi bi-binoculars-fill" style="font-size: 4rem; color: var(--strand-purple);"></i><h4 class="mt-3">Observatório AetherMap</h4><p class="text-muted">Carregue seus dados para começar a explorar.</p></div></div>
            </div>

            <!-- <<< A NOVA ALA DO ESCRIBA >>> (30%) -->
            <div class="col-lg-4">
                <div id="scribe-wing" class="scribe-wing fade-in-section">
                    <div id="scribe-wing-content">
                        <!-- Conteúdo dinâmico (Análise de Cluster ou Resultados da Busca) aparecerá aqui -->
                        <div class="text-center p-5"><i class="bi bi-journal-richtext" style="font-size: 3rem; color: var(--text-muted);"></i><p class="mt-3 text-muted">Aguardando a geração do universo para exibir as análises...</p></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="modal fade" id="pointDetailModal" tabindex="-1">
        <!-- ... (Modal permanece o mesmo) ... -->
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="script.js"></script>
</body>
</html>
