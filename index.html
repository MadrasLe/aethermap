<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AetherMap by Strand DataOps</title>

    <!-- Frameworks e Bibliotecas Essenciais -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-2.29.1.min.js" charset="utf-8"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.min.js"></script>

    <!-- Nosso Estilo Personalizado e Sofisticado -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ======================================= -->
    <!-- A Barra de Navegação Real (Navbar)      -->
    <!-- ======================================= -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="logo.png" alt="Strand DataOps Logo" class="header-logo">
                <span>AetherMap</span>
            </a>
        </div>
    </nav>

    <!-- ======================================= -->
    <!-- O Conteúdo Principal do Palácio         -->
    <!-- ======================================= -->
    <main class="container mt-4">
        <div class="row">
            <!-- Layout de coluna única, centralizado para foco total -->
            <div class="col-lg-10 mx-auto">
                
                <!-- Os Controles Inteligentes em formato Accordion -->
                <div class="accordion mb-4" id="controlsAccordion">
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseControls" aria-expanded="true" aria-controls="collapseControls">
                                ⚙️ Controles de Análise
                            </button>
                        </h2>
                        <div id="collapseControls" class="accordion-collapse collapse show" data-bs-parent="#controlsAccordion">
                            <div class="accordion-body">
                                <div class="row align-items-center">
                                    <div class="col-md-5 mb-3 mb-md-0">
                                        <label for="fileUpload" class="form-label">1. Carregue seu arquivo .txt</label>
                                        <input class="form-control" type="file" id="fileUpload" accept=".txt">
                                    </div>
                                    <div class="col-md-7 mb-3 mb-md-0">
                                        <label for="samplesSlider" class="form-label">2. Número de Amostras: <span id="samplesValue" class="fw-bold">10000</span></label>
                                        <input type="range" class="form-range" min="500" max="50000" step="500" value="10000" id="samplesSlider">
                                    </div>
                                </div>
                                <div class="d-grid mt-3">
                                    <button id="processButton" class="btn btn-primary btn-lg">✨ Gerar Universo ✨</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- A Animação de Carregamento (A Forja) -->
                <div id="loadingSection" class="text-center my-5 d-none">
                    <div class="spinner-border" style="width: 3rem; height: 3rem;" role="status"></div>
                    <p class="mt-3 fs-5">Forjando o universo... Isso pode levar alguns minutos.</p>
                    <small class="text-muted">A Torre do Mago está processando sua requisição.</small>
                </div>

                <!-- A Barra de Busca (O Leme) -->
                <div class="mb-3 d-none" id="search-card">
                    <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="🔎 Busque por um conceito para destacar no universo...">
                </div>

                <!-- O Observatório (Gráfico 3D) -->
                <div id="plotContainer" class="rounded" style="min-height: 70vh;"></div>
                
                <!-- O Painel de Descobertas (Resultados) -->
                <div id="resultsPanel" class="mt-4 d-none">
                    <div class="row">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-body">
                                    <h5 class="card-title">Análise Quantitativa</h5>
                                    <div id="metrics-container" class="row text-center gy-3"></div>
                                    <hr class="my-4">
                                    <div id="keywords-container"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row mt-4">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-body">
                                    <h5 class="card-title">Análise de Duplicidade</h5>
                                    <div id="duplicates-container"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>
    
    <!-- Scripts essenciais para interatividade -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
