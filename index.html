<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AetherMap Intelligence</title>

    <!-- Bootstrap (estrutura) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Plotly e Fuse.js -->
    <script src="https://cdn.plot.ly/plotly-2.29.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2/dist/fuse.min.js"></script>

    <!-- CSS Palantir -->
    <link rel="stylesheet" href="style-palantir.css">
</head>
<body>
    <nav class="navbar">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="logo.png" alt="Strand" class="header-logo">
                <span class="brand-title">AetherMap Intelligence</span>
            </a>
        </div>
    </nav>

    <main class="container mt-4 mb-5">
        <div class="row">
            <div class="col-lg-10 mx-auto">

                <!-- CONTROLS -->
                <section class="card mb-4" id="controlsCard">
                    <div class="card-body">
                        <h5 class="card-title">Painel de Análise</h5>

                        <div class="mb-3">
                            <label class="form-label small text-muted">1. Carregar arquivo .txt</label>
                            <input id="fileUpload" type="file" accept=".txt" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label small text-muted">2. Número de Amostras: <span id="samplesValue">10000</span></label>
                            <input id="samplesSlider" type="range" min="100" max="50000" step="100" value="10000" class="form-range">
                        </div>

                        <div class="d-flex justify-content-center">
                            <button id="processButton" class="btn btn-primary btn-lg">✨ Gerar Universo ✨</button>
                        </div>
                    </div>
                </section>

                <!-- SEARCH -->
                <section class="card mb-4" id="searchCard">
                    <div class="card-body">
                        <h6 class="card-title">Busca Semântica</h6>
                        <input id="searchInput" type="text" class="form-control" placeholder="Buscar conceito no universo...">
                    </div>
                </section>

                <!-- PLOT -->
                <section class="card mb-4">
                    <div class="card-body">
                        <h6 class="card-title">Mapa Semântico 3D</h6>
                        <div id="plotContainer" style="height:640px; min-height:360px;"></div>
                    </div>
                </section>

                <!-- METRICS -->
                <section class="card mb-4">
                    <div class="card-body">
                        <h6 class="card-title">Análise Quantitativa</h6>
                        <div id="metricsGrid" class="metrics-grid"></div>
                        <div id="keywords-container" class="mt-3"></div>
                    </div>
                </section>

                <!-- DUPLICATES -->
                <section class="card mb-4">
                    <div class="card-body">
                        <h6 class="card-title">Análise de Duplicidade</h6>
                        <div id="duplicates-container"></div>
                    </div>
                </section>

            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Seu script -->
    <script src="script-palantir.js"></script>
</body>
</html>
