<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AetherMap by Strand DataOps</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.plot.ly/plotly-2.29.1.min.js" charset="utf-8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container-fluid"><a class="navbar-brand d-flex align-items-center" href="#"><img src="logo.png" alt="Strand DataOps Logo" class="header-logo"><span>AetherMap</span></a></div>
    </nav>

    <main class="container-fluid mt-4">
        <!-- <<< AS GALERIAS DE ARTE, RESTAURADAS À SUA POSIÇÃO DE HONRA >>> -->
        <div class="row mb-4 fade-in-section" id="overview-charts-row" style="visibility: hidden;">
            <div class="col-lg-10 mx-auto">
                <div class="row gy-4">
                    <div class="col-lg-7"><div class="card h-100"><div class="card-body d-flex flex-column"><h5 class="card-title mb-3">Crônicas do Reino: Top Palavras-Chave Globais</h5><div class="chart-container flex-grow-1"><canvas id="tfidfChart"></canvas></div></div></div></div>
                    <div class="col-lg-5"><div class="card h-100"><div class="card-body d-flex flex-column"><h5 class="card-title mb-3">Censo do Reino: Distribuição de Clusters</h5><div class="chart-container flex-grow-1" style="max-height: 300px; margin: auto;"><canvas id="clusterDistributionChart"></canvas></div></div></div></div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-8">
                <div class="accordion mb-4" id="controlsAccordion"><!-- ... Controles ... --></div>
                <div id="loadingSection" class="text-center my-5 d-none"><!-- ... Loading ... --></div>
                <div id="search-card" class="mb-3 fade-in-section" style="visibility: hidden;"><!-- ... Busca ... --></div>
                <div id="plotContainer" class="rounded"><!-- ... Observatório 3D ... --></div>
            </div>
            <div class="col-lg-4">
                <div id="scribe-wing" class="scribe-wing fade-in-section" style="visibility: hidden;"><div id="scribe-wing-content"><!-- ... Ala do Escriba ... --></div></div>
            </div>
        </div>

        <!-- Adicionando a seção de Duplicados novamente -->
        <div class="row mt-4 fade-in-section" id="duplicates-row" style="visibility: hidden;">
             <div class="col-lg-10 mx-auto">
                <div class="card"><div class="card-body"><h5 class="card-title">A Guarda Real: Análise de Duplicidade</h5><div id="duplicates-container"></div></div></div>
             </div>
        </div>
    </main>
    
    <div class="modal fade" id="pointDetailModal" tabindex="-1"><!-- ... Modal ... --></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="script.js"></script>
</body>
</html>
